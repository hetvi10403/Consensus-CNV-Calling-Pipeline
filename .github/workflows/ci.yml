name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # Fast wiring/syntax check: runs the whole DSL2 graph with -stub-run
  # against tiny placeholder data. No conda/Docker/real tools needed —
  # every process's `stub:` block just touches its declared output files.
  validate-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Stub-run against test data
        run: nextflow run main.nf -profile test -stub-run

      - name: Upload Nextflow execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-reports
          path: |
            timeline.html
            report.html
            trace.txt
            dag.png

  # Confirms both images actually build. Doesn't push anywhere or run any
  # real analysis (AnnotSV's annotation DB alone is tens of GB, too heavy
  # for CI) — this is just "does the Dockerfile still work" coverage.
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build gatk_cd image
        run: docker build -f docker/gatk_cd.Dockerfile -t cnv-pipeline-gatk_cd:latest docker/

      - name: Build cnvkit image
        run: docker build -f docker/cnvkit.Dockerfile -t cnv-pipeline-cnvkit:latest docker/
